paths:
  raw_data: "data/raw/creditcard.csv"
  model_output: "models/model_artifacts.pkl"

train_params:
  train_size: 0.8
  val_size: 0.1
  n_iter: 15
  cv_splits: 5

search_space:
  classifier__max_depth: [3, 5, 7]          # was 9
  classifier__subsample: [0.5, 0.7, 0.9]    # avoid 1.0
  classifier__colsample_bytree: [0.5, 0.7, 0.9]
  classifier__n_estimators: [100, 200, 300] # keep as is
  classifier__learning_rate: [0.01, 0.05, 0.1]
    